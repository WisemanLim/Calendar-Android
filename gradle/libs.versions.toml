[versions]
agp = "8.7.0"
kotlin = "2.2.0"
composeBom = "2025.01.00"
activityCompose = "1.9.3"
lifecycleViewmodelCompose = "2.8.7"
lifecycleRuntimeKtx = "2.8.7"
navigationCompose = "2.8.5"
datastorePreferences = "1.1.1"
retrofit = "2.11.0"
okhttpLogging = "4.12.0"
playServicesLocation = "21.3.0"
coil = "2.7.0"
junit = "4.13.2"
androidxTestExt = "1.2.1"
appcompat = "1.7.0"

[libraries]
compose-bom                 = { group = "androidx.compose", name = "compose-bom",              version.ref = "composeBom" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4      = { group = "androidx.compose.ui", name = "ui-test-junit4" }
activity-compose            = { group = "androidx.activity", name = "activity-compose",        version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
navigation-compose          = { group = "androidx.navigation", name = "navigation-compose",    version.ref = "navigationCompose" }
datastore-preferences       = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
retrofit                    = { group = "com.squareup.retrofit2", name = "retrofit",           version.ref = "retrofit" }
retrofit-converter-gson     = { group = "com.squareup.retrofit2", name = "converter-gson",    version.ref = "retrofit" }
okhttp-logging              = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttpLogging" }
play-services-location      = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
coil-compose                = { group = "io.coil-kt", name = "coil-compose",                   version.ref = "coil" }
appcompat                   = { group = "androidx.appcompat", name = "appcompat",             version.ref = "appcompat" }
junit                       = { group = "junit", name = "junit",                               version.ref = "junit" }
androidx-test-ext           = { group = "androidx.test.ext", name = "junit",                  version.ref = "androidxTestExt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
